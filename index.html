<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
    <title>Neue App</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">Starter</p>
          <h1>Neue App</h1>
        </div>
        <nav class="nav">
          <button class="nav-item active" type="button">Übersicht</button>
          <button class="nav-item" type="button">Projekte</button>
          <button class="nav-item" type="button">Einstellungen</button>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Willkommen</p>
            <h2>Dein neues Projekt</h2>
          </div>
          <button id="reset" class="secondary-btn" type="button">Zurücksetzen</button>
        </header>

        <section class="hero">
          <div>
            <p class="eyebrow">Status</p>
            <h3>Alles läuft sauber</h3>
          </div>
          <span id="day-badge" class="status-pill">Heute</span>
        </section>

        <section class="card-grid">
          <article class="card">
            <p class="card-label">Aufgaben</p>
            <strong id="task-count">0</strong>
          </article>
          <article class="card">
            <p class="card-label">Erledigt</p>
            <strong id="done-count">0</strong>
          </article>
          <article class="card accent">
            <p class="card-label">Zeit</p>
            <strong id="clock">--:--</strong>
          </article>
        </section>

        <section class="todo-panel">
          <div class="todo-header">
            <h3>To-do Liste</h3>
            <span id="task-summary">0 Einträge</span>
          </div>

          <form id="todo-form" class="todo-form">
            <input id="todo-input" type="text" placeholder="Neue Aufgabe eingeben" maxlength="80" />
            <button type="submit">Hinzufügen</button>
          </form>

          <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
